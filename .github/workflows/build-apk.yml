name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unpack the signing key
        run: base64 -d signing/fridgeraid.keystore.b64 > app/fridgeraid.keystore

      - name: Build the APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk FridgeRaid.apk

      - name: Keep the APK with this build
        uses: actions/upload-artifact@v4
        with:
          name: FridgeRaid-apk
          path: FridgeRaid.apk

      - name: Publish the APK as a release you can download on your phone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fridge Raid build ${{ github.run_number }}
          body: Download FridgeRaid.apk below on your Android phone, then open it to install.
          files: FridgeRaid.apk
          make_latest: true
